interface:
  display_name: "STS2 Ironclad Player"
  short_description: "提供战士基础教学、战斗构筑与路线建议，并在明确授权后自主爬塔"
  default_prompt: "Use $sts2-ironclad-player to inspect the current Ironclad run and advise me; act only within my explicit authorization."

dependencies:
  tools:
    - type: "mcp"
      value: "sts2"
      description: "Read the current Slay the Spire 2 state and execute candidate actions."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
