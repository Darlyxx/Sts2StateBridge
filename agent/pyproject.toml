[project]
name = "sts2-agent"
version = "0.6.0"
description = "Optional LangChain AI client for the standalone STS2 MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0,<2",
    "langchain-openai>=1.0.0,<2",
    "langchain-mcp-adapters>=0.2.0,<1",
    # langchain-mcp-adapters 0.x currently targets the MCP Python SDK 1.x.
    # The standalone server has its own environment and remains on MCP 2.x.
    "mcp>=1.9.2,<2",
    "openai>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.scripts]
sts2-agent = "sts2_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts2_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
