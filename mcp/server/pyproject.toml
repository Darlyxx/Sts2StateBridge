[project]
name = "sts2-mcp"
version = "0.9.0"
description = "Standalone MCP server for Sts2StateBridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.scripts]
sts2-mcp = "sts2_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0.0,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts2_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
